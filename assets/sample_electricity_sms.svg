<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <!-- Smartphone Screen Shell -->
  <rect width="600" height="750" fill="#0f172a"/>
  
  <!-- Phone Frame -->
  <rect x="40" y="30" width="520" height="690" rx="36" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="60" y="60" width="480" height="630" rx="20" fill="#0b1120"/>

  <!-- Status Bar -->
  <text x="90" y="90" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="bold">09:14 PM</text>
  <circle cx="490" cy="85" r="4" fill="#10b981"/>
  <rect x="502" y="80" width="18" height="10" rx="2" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="504" y="82" width="12" height="6" rx="1" fill="#94a3b8"/>

  <!-- SMS Header -->
  <circle cx="100" cy="140" r="24" fill="#3b82f6"/>
  <text x="100" y="148" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">⚡</text>
  <text x="140" y="136" font-family="Arial, sans-serif" font-size="16" fill="#f8fafc" font-weight="bold">+91 98765-43210</text>
  <text x="140" y="154" font-family="Arial, sans-serif" font-size="12" fill="#ef4444">Unknown Sender (Personal SIM)</text>

  <!-- SMS Bubble -->
  <rect x="80" y="190" width="440" height="340" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

  <text x="105" y="225" font-family="'Arial Black', sans-serif" font-size="14" fill="#ef4444">⚠️ URGENT ELECTRICITY DISCONNECTION NOTICE</text>
  
  <text x="105" y="260" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">Dear Consumer,</text>
  <text x="105" y="285" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">Your power supply will be <tspan fill="#f87171" font-weight="bold">DISCONNECTED TONIGHT</tspan></text>
  <text x="105" y="305" font-family="Arial, sans-serif" font-size="13" fill="#f87171" font-weight="bold">AT 9:30 PM from the Sub-Station.</text>
  <text x="105" y="335" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">Reason: Previous month bill ₹1,420 not updated.</text>
  
  <text x="105" y="375" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">To avoid blackout, immediately call our</text>
  <text x="105" y="395" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">Electricity Officer Mr. Rajesh Sharma:</text>
  <text x="105" y="420" font-family="'Courier New', monospace" font-size="15" fill="#38bdf8" font-weight="bold">📞 +91 98765 43210</text>
  
  <text x="105" y="455" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">Or update via quick server link:</text>
  <text x="105" y="480" font-family="Arial, sans-serif" font-size="13" fill="#38bdf8" text-decoration="underline">http://bijli-bill-update.online/pay</text>
  
  <text x="440" y="515" font-family="Arial, sans-serif" font-size="10" fill="#64748b">8:45 PM</text>

  <!-- Threat Tag -->
  <rect x="140" y="570" width="320" height="38" rx="8" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5"/>
  <text x="300" y="594" font-family="Arial, sans-serif" font-size="13" fill="#ef4444" font-weight="bold" text-anchor="middle">🚨 CLASSIC UTILITY SMS SCAM VECTOR</text>
</svg>
