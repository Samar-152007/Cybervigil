<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <!-- Cheque Border & Security Pattern Background -->
  <rect width="850" height="500" fill="#f0fdf4"/>
  <rect x="20" y="20" width="810" height="460" rx="12" fill="#ffffff" stroke="#059669" stroke-width="3"/>
  <rect x="30" y="30" width="790" height="440" rx="8" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- KBC Logo & Title -->
  <g transform="translate(50, 50)">
    <circle cx="45" cy="45" r="35" fill="#1e1b4b" stroke="#f59e0b" stroke-width="3"/>
    <text x="45" y="42" font-family="'Arial Black', sans-serif" font-size="16" fill="#facc15" text-anchor="middle">KBC</text>
    <text x="45" y="58" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">LUCKY DRAW</text>

    <text x="100" y="38" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" fill="#065f46">ALL INDIA SIM CARD MEGA LOTTERY</text>
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="13" fill="#047857">JOINT PROMOTION: KAUN BANEGA CROREPATI &amp; RELIANCE JIO</text>
  </g>

  <!-- Cheque Details Grid -->
  <g transform="translate(600, 55)" font-family="'Courier New', monospace" font-size="13" fill="#065f46">
    <text x="0" y="0">DATE: 29-10-2026</text>
    <text x="0" y="22">CHEQUE: KBC-25L-8912</text>
  </g>

  <!-- Payee & Amount -->
  <g transform="translate(60, 160)" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">
    <text x="0" y="0" font-weight="bold" fill="#047857">PAY TO THE ORDER OF:</text>
    <text x="210" y="0" font-family="'Courier New', monospace" font-size="17" font-weight="bold" fill="#1e293b">LUCKY MOBILE SUBSCRIBER</text>
    <line x1="205" y1="5" x2="760" y2="5" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="0" y="45" font-weight="bold" fill="#047857">SUM OF RUPEES:</text>
    <text x="210" y="45" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#1e293b">TWENTY FIVE LAKH RUPEES ONLY</text>
    <line x1="205" y1="50" x2="520" y2="50" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Amount Badge -->
    <rect x="540" y="20" width="220" height="42" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="650" y="48" font-family="'Arial Black', sans-serif" font-size="20" fill="#047857" text-anchor="middle">₹ 25,00,000/-</text>
  </g>

  <!-- Warning Box / Scam Condition -->
  <rect x="60" y="250" width="720" height="95" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <g transform="translate(80, 275)" font-family="Arial, sans-serif" font-size="13">
    <text x="0" y="0" font-weight="bold" fill="#991b1b">⚠️ MANDATORY TAX &amp; PROCESSING FEE REQUIREMENT TO RELEASE CHEQUE:</text>
    <text x="0" y="24" fill="#7f1d1d">1. Transfer Government Lottery Tax Clearance Fee of <tspan font-weight="bold" fill="#b91c1c">₹25,000/-</tspan> before funds dispatch.</text>
    <text x="0" y="46" fill="#7f1d1d">2. Contact KBC Verification Officer Mr. Amitabh Roy on WhatsApp: <tspan font-family="'Courier New', monospace" font-weight="bold" fill="#1d4ed8">+92 301 9876543</tspan></text>
  </g>

  <!-- Stamp and Signatures -->
  <g transform="translate(620, 390)">
    <path d="M-30,20 Q10,5 40,25 T90,15" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <text x="35" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Authorized Signatory</text>
    <text x="35" y="55" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">KBC Lottery Directorate</text>
  </g>

  <!-- Fake Red Stamp -->
  <g transform="translate(350, 390)">
    <circle cx="30" cy="20" r="38" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="30" y="16" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">OFFICIAL</text>
    <text x="30" y="28" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">PRIZE APPROVED</text>
  </g>

  <!-- MICR Band -->
  <rect x="50" y="445" width="740" height="25" fill="#f8fafc"/>
  <text x="400" y="462" font-family="'Courier New', monospace" font-size="14" fill="#334155" font-weight="bold" text-anchor="middle">
    ⑆000214⑆ 110002014⑆ 001928⑈ 25
  </text>
</svg>
